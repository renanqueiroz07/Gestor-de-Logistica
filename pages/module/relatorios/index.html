<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2Brothers - Relatórios</title>
  <link rel="icon" type="image/svg+xml" href="../../../favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../inicio.server/delivery_b2b_dashboard.css">
  <link rel="stylesheet" href="./styles/relatorios.css">
  <script defer src="../../../inicio.server/theme.js"></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="logo">2Brothers <span style="font-size:11px;color:var(--muted);font-weight:400;margin-left:4px">B2B Delivery</span></div>
      <div class="topbar-right">
        <div class="time-display" id="clock">00:00:00</div>
        <div class="status-badge"><div class="status-dot"></div>Sistema ativo</div>
        <div class="avatar">RH</div>
      </div>
    </div>

    <div class="sidebar">
      <div class="nav-item" onclick="window.location.href='../../../inicio.server/delivery_b2b_dashboard.html'">Dashboard</div>
      <div class="nav-item" onclick="window.location.href='../rotas/'">Rotas ao vivo<div class="nav-badge">3</div></div>
      <div class="nav-item" onclick="window.location.href='../pedidos/'">Pedidos<div class="nav-badge">7</div></div>
      <div class="nav-item" onclick="window.location.href='../entregadores/'">Entregadores<div class="nav-badge">12</div></div>
      <div class="nav-item active" onclick="window.location.href='./'">Relatórios<div class="nav-badge">—</div></div>
      <div class="nav-item" onclick="window.location.href='../../clientes/'">Clientes<div class="nav-badge">0</div></div>
    </div>

    <div class="main">
      <div class="metrics-row" id="reportsMetrics"></div>

      <div class="content-grid">
        <div class="orders-panel">
          <div class="panel-header">
            <div class="panel-title">Relatórios</div>
            <div class="panel-actions">
              <button id="btnExport" class="btn-sm">Exportar CSV</button>
            </div>
          </div>

          <div class="panel-body" id="reportsBody">
            <div id="filters" style="display:flex;gap:10px;flex-wrap:wrap;padding:12px 16px;">
              <input id="filterQuery" class="form-input" placeholder="Buscar pedidos, cliente, entregador" />
              <select id="filterStatus" class="form-input"><option value="all">Todos os status</option><option value="done">Concluído</option><option value="pending">Pendente</option><option value="canceled">Cancelado</option></select>
              <input id="filterFrom" type="date" class="form-input" />
              <input id="filterTo" type="date" class="form-input" />
            </div>

            <div id="reportsTables"></div>
          </div>
        </div>

        <div class="map-panel">
          <div class="panel-header"><div class="panel-title">Gráficos e Faturamento</div></div>
          <div class="panel-body">
            <div id="chartPlaceholder" class="mini-panel">Gráficos (placeholder)</div>
            <div id="revenueSummary" class="mini-panel"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./relatorios.js"></script>
</body>
</html>
